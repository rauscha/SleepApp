<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Keep pinch-zoom enabled (a11y: WCAG SC 1.4.4). Sleep audiences often
         include low-vision users — disabling zoom would push them away. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- CSP: this is a static, single-page PWA. The only same-origin scripts
         are the bundled app + the public worklet. Third-party connections:
         the Inter font CSS (rsms.me). Phase 4 will need to relax connect-src
         for ElevenLabs + Anthropic; that scope expansion happens then. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://rsms.me; font-src 'self' https://rsms.me; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob: data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none';"
    />
    <title>Sleep</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
