<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Keep pinch-zoom enabled (a11y: WCAG SC 1.4.4). Sleep audiences often
         include low-vision users — disabling zoom would push them away. -->
    <!-- No viewport-fit=cover: in an Android standalone PWA, cover draws the
         app edge-to-edge UNDER the system navigation bar, which hides the
         bottom tab bar behind the gesture/nav bar (Chrome reports
         safe-area-inset-bottom as 0, so padding can't rescue it). Without
         cover, the webview is laid out above the nav bar and the tab bar is
         visible. Player immersion comes from the Fullscreen API, not cover. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- CSP: this is a static, single-page PWA. The only same-origin scripts
         are the bundled app + the public worklet. Inter is self-hosted from
         /fonts/ so no third-party font origin is needed. connect-src is
         widened for the in-app meditation/story generators which call the
         Anthropic Messages API for script writing and the ElevenLabs TTS
         API for synthesis (src/services/storyGenerator.ts). The CLI tools
         hit the same origins but bypass CSP entirely via Node. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.elevenlabs.io https://api.anthropic.com; media-src 'self' blob: data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none';"
    />
    <title>Sleep</title>
    <!-- The base-URL placeholder below is substituted by Vite to the
         resolved base ('/SleepApp/' on the GitHub Pages deploy, '/' at the
         root). Vite only rewrites a known set of HTML attributes
         automatically; ad-hoc <link> hrefs aren't on that list, so we use
         the placeholder explicitly to keep these references base-correct. -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <!-- Preload the variable font so it's in flight while CSS parses. Without
         this, @font-face discovery is late and the first paint flashes the
         system fallback (FOUT). crossorigin is required even for same-origin
         font preloads — fonts are always fetched in CORS mode. -->
    <link rel="preload" href="%BASE_URL%fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Preload the editorial serif too: headings (the brand's voice) use it,
         so a late @font-face discovery would flash Georgia/Noto on first paint. -->
    <link rel="preload" href="%BASE_URL%fonts/EBGaramond-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
