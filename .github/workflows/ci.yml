name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new commit lands. Saves
# CI minutes on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + test + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `npm install`, not `ci`. esbuild ships per-platform optional
        # dependencies (@esbuild/linux-x64, @esbuild/darwin-arm64, …) that
        # npm only writes to package-lock.json for the platform you ran
        # `npm install` on. Since the lock is generated on Windows, the
        # Linux runner's `npm ci` rejects it as missing entries. `install`
        # resolves the current platform's deps without that strict check.
        # --no-audit because the audit step is gated elsewhere.
        run: npm install --no-audit

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
