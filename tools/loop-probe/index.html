<!doctype html>
<html><head><meta charset="utf-8"><title>loop probe</title></head>
<body><script src="howler.js"></script>
<script>
const SRC = 'loop.opus';
const PERIOD = 2.0065;      // real duration of loop.opus
const SAMPLE_MS = 20;
const RUN_MS = 25000;       // ~12 wraps

// Exact gap measurement: listen to the element's own transport events and
// time the interval where it is not producing audio. 'pause'->'play' is the
// restart; 'seeking'->'seeked' is the rewind. Far more precise than polling.
function instrument(node) {
  const ev = [];
  for (const name of ['pause', 'play', 'playing', 'seeking', 'seeked', 'ended', 'waiting', 'stalled']) {
    node.addEventListener(name, () => ev.push([name, performance.now()]));
  }
  return ev;
}

function gapsFrom(ev) {
  // Silence runs from the moment it pauses (or starts seeking) to the moment
  // it is playing again.
  const gaps = [];
  let openedAt = null;
  for (const [name, t] of ev) {
    if ((name === 'pause' || name === 'seeking') && openedAt === null) openedAt = t;
    if (name === 'playing' && openedAt !== null) { gaps.push(t - openedAt); openedAt = null; }
  }
  return gaps;
}

function measure(node, label, extra) {
  return new Promise((resolve) => {
    const samples = [];
    const t0 = performance.now();
    const id = setInterval(() => {
      samples.push([performance.now() - t0, node.currentTime, node.paused]);
    }, SAMPLE_MS);
    setTimeout(() => {
      clearInterval(id);
      // Walk the samples, accumulating how much AUDIO advanced. A wrap is a
      // decrease in currentTime; across it the audio advanced from prev to
      // the end of the file and then from 0 (or the seek target) to cur.
      let audio = 0, wraps = 0, pausedSamples = 0;
      const wrapGaps = [];
      for (let i = 1; i < samples.length; i++) {
        const [wPrev, aPrev] = samples[i - 1];
        const [wCur, aCur, paused] = samples[i];
        if (paused) pausedSamples++;
        if (aCur >= aPrev) {
          audio += aCur - aPrev;
        } else {
          wraps++;
          const advanced = (PERIOD - aPrev) + aCur;
          audio += advanced;
          // Wall time spent on this step minus audio advanced across it =
          // the silence introduced at the wrap.
          wrapGaps.push((wCur - wPrev) / 1000 - advanced);
        }
      }
      const wall = samples[samples.length - 1][0] / 1000 - samples[0][0] / 1000;
      resolve({
        label,
        wraps,
        wallSeconds: +wall.toFixed(3),
        audioSeconds: +audio.toFixed(3),
        deficitSeconds: +(wall - audio).toFixed(3),
        gapPerWrapMs: wraps ? +(((wall - audio) / wraps) * 1000).toFixed(1) : null,
        worstWrapGapMs: wrapGaps.length ? +(Math.max(...wrapGaps) * 1000).toFixed(1) : null,
        pausedSamples,
        ...extra(),
      });
    }, RUN_MS);
  });
}

// A — the control: a bare <audio loop> element, no Howler anywhere.
async function bareElement() {
  const el = new Audio(SRC);
  el.loop = true;
  el.volume = 0.2;
  const ev = instrument(el);
  await el.play();
  return measure(el, 'A: bare <audio loop>', () => ({
    transportGapsMs: gapsFrom(ev).map((g) => +g.toFixed(1)),
  }));
}

// B — production today: Howler html5 with loop:true.
async function howlerLoop() {
  let plays = 0, ends = 0;
  const h = new Howl({ src: [SRC], format: ['opus'], html5: true, loop: true, volume: 0.2 });
  h.on('play', () => plays++);
  h.on('end', () => ends++);
  h.play();
  await new Promise((r) => setTimeout(r, 600));
  const node = h._sounds[0]._node;
  const ev = instrument(node);
  const res = await measure(node, 'B: Howler loop:true', () => ({
    howlerPlayEvents: plays, howlerEndEvents: ends,
    nodeLoopAttribute: node.loop,
    transportGapsMs: gapsFrom(ev).map((g) => +g.toFixed(1)),
  }));
  h.unload();
  return res;
}

// C — the proposed fix: Howler with loop:false, element's own loop on.
async function nativeLoop() {
  let plays = 0, ends = 0;
  const h = new Howl({ src: [SRC], format: ['opus'], html5: true, loop: false, volume: 0.2 });
  h.on('play', () => { plays++; const n = h._sounds[0] && h._sounds[0]._node; if (n) n.loop = true; });
  h.on('end', () => ends++);
  h.play();
  await new Promise((r) => setTimeout(r, 600));
  const node = h._sounds[0]._node;
  const ev = instrument(node);
  const res = await measure(node, 'C: Howler loop:false + node.loop', () => ({
    transportGapsMs: gapsFrom(ev).map((g) => +g.toFixed(1)),
    howlerPlayEvents: plays, howlerEndEvents: ends,
    nodeLoopAttribute: node.loop,
    stillPlaying: h.playing(),
    // Does fade() still work once Howler is no longer managing the loop?
    fadeWorks: (() => { try { h.fade(0.2, 0.05, 50); return true; } catch { return false; } })(),
  }));
  h.unload();
  return res;
}

window.__run = async () => {
  const out = [];
  out.push(await bareElement());
  out.push(await howlerLoop());
  out.push(await nativeLoop());
  return out;
};
</script></body></html>
